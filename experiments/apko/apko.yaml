contents:
  repositories:
    - https://packages.wolfi.dev/os
    - /work/experiments/melange/packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/experiments/melange/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - frankenstein-runtime

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
  - aarch64

entrypoint:
  command: /usr/bin/frankenstein-runtime

environment:
  PORT: "8080"

work-dir: /home/nonroot
