package:
  name: frankenstein-runtime
  version: 0.1.0
  epoch: 0
  description: "Minimal Go HTTP server built with melange for Frankenstein-CI"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - name: Build Go HTTP server
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/frankenstein-runtime" \
        ./main.go
